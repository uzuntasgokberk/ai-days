# Repo kontrolleri: her bölüm klasörü tam mı, PDF'ler makul boyutta ve yerel yol içermiyor mu, göreli linkler çalışıyor mu.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Bölüm, PDF ve link kontrolleri
        run: python3 scripts/kontrol.py
